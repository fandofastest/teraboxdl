<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TeraCloud - Stream & Watch Videos</title>
    
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- HLS.js for Streaming -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="/css/public.css">
</head>
<body>

<!-- Navbar -->
<header class="public-nav">
    <div class="nav-container">
        <a href="/" class="brand-logo">
            <div class="logo-icon"><i class="fa-solid fa-play"></i></div>
            <div class="logo-text">TeraCloud <span>STREAM</span></div>
        </a>

        <div class="nav-search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="public-search" placeholder="Cari judul video...">
        </div>

        <div class="nav-actions">
            <select id="public-sort" class="sort-select">
                <option value="newest">Terbaru</option>
                <option value="oldest">Terlama</option>
                <option value="size_desc">Ukuran Terbesar</option>
                <option value="title_asc">Judul (A-Z)</option>
            </select>
            <a href="/admin" class="btn-admin-link" title="Admin Login"><i class="fa-solid fa-lock"></i></a>
        </div>
    </div>
</header>

<!-- Main Feed -->
<main class="public-main">
    <div class="video-grid" id="public-video-grid">
        <!-- Rendered by JS -->
    </div>

    <!-- Pagination -->
    <div class="pagination-wrap" id="public-pagination">
        <!-- Rendered by JS -->
    </div>
</main>

<!-- Fullscreen TikTok-Style Vertical Video Player with Vertical Swipe Next/Prev -->
<div class="player-overlay" id="player-overlay">
    <div class="player-header">
        <div class="player-info">
            <h3 id="current-video-title">Memuat video...</h3>
            <span id="current-video-meta">1 / 1</span>
        </div>
        <button class="btn-close-player" id="btn-close-player" title="Tutup"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <!-- TikTok-Style Swipeable Video Stage -->
    <div class="player-stage" id="player-stage">
        <video id="public-video-element" playsinline controls autoplay loop></video>

        <!-- Vertical TikTok Action Bar (Samping Kanan) -->
        <div class="tiktok-actions">
            <button class="tiktok-action-btn" id="btn-prev-video" title="Video Sebelumnya (Swipe Bawah)">
                <i class="fa-solid fa-chevron-up"></i>
                <span>Prev</span>
            </button>
            <button class="tiktok-action-btn" id="btn-next-video" title="Video Selanjutnya (Swipe Atas)">
                <i class="fa-solid fa-chevron-down"></i>
                <span>Next</span>
            </button>
            <button class="tiktok-action-btn" id="btn-copy-public-link" title="Bagikan Video">
                <i class="fa-solid fa-share-nodes"></i>
                <span>Share</span>
            </button>
        </div>
    </div>

    <div class="player-footer">
        <div class="swipe-hint">
            <i class="fa-solid fa-arrows-up-down"></i> Swipe ke Atas / Bawah untuk ganti video (seperti TikTok)
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast-container" id="toast-container"></div>

<script src="/js/public.js"></script>
</body>
</html>
